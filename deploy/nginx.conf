# The public tier's front door, and the thing that makes a deploy invisible.
#
# cloudflared connects to :8080 here rather than straight to a Next container,
# for one reason: a container cannot be replaced without going away, but an
# nginx UPSTREAM can be repointed and reloaded while connections are open. That
# turns "stop the old app, start the new one, hope nobody was mid-request" into
# a config reload nginx performs by starting new workers and letting the old
# ones finish what they are already serving. Requests in flight complete against
# the version that started them.
#
# Two listeners, because there are two things to swap:
#
#   8080  public.   cloudflared -> here -> the active web (Next) container.
#   8081  internal. The web tier's INTERNAL_API_URL -> here -> the active API.
#         Never exposed through the tunnel; it exists so the API can be swapped
#         on the same terms as the web tier instead of being restarted under
#         live traffic.
#
# Server-rendered pages and browser calls both reach the API through 8081 — the
# app already routes every /api call through INTERNAL_API_URL or the Next rewrite
# that points at it — so this changes where the API is, not how it is called.
#
# Unprivileged image: no master process as root, which is why the ports are 8080
# and 8081 rather than 80. The tunnel's public hostname must therefore say
# http://nginx:8080.

worker_processes  auto;
# To the container's stdout/stderr, not a file. A tmpfs at /var/log/nginx is
# owned by root and this image runs as uid 101, so nginx could not open a log
# there and died before serving anything. Logging to the standard streams is
# also simply how a container should do it: `docker logs` gets it, and there is
# no file to rotate or fill.
error_log  /dev/stderr warn;
pid        /tmp/nginx.pid;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Unprivileged nginx cannot write to /var/cache/nginx.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # The real client address arrives as CF-Connecting-IP: Cloudflare overwrites
    # it on every proxied request and strips any inbound copy, so it is the one
    # header here that cannot be forged from outside. The API's rate limiter
    # reads it (TRUST_PROXY_HEADER=true) and it must survive this hop intact —
    # losing it would put every visitor in one bucket and the limiter would
    # throttle the whole site as though it were a single abusive client.
    log_format  main  '$http_cf_connecting_ip - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log  /dev/stdout  main;

    sendfile        on;
    tcp_nopush      on;
    # The second value is the one that matters here: it makes nginx send
    # `Keep-Alive: timeout=60`, and without it a client has no way of knowing
    # when nginx will drop an idle connection.
    #
    # Next proxies /api/* to nginx:8081 over a pooled keep-alive connection. When
    # nginx closed one at 65s and Node reused it anyway, the request died with
    # ECONNRESET and the visitor got a 500 — while the API logged nothing at all,
    # because the request never reached it:
    #
    #   Failed to proxy http://nginx:8081/api/search [Error: socket hang up]
    #
    # It only ever hit the first search after a quiet spell, which is the worst
    # possible distribution: invisible under load and in testing, and reliably
    # hitting whoever arrives at an idle site first.
    keepalive_timeout  65 60;

    # Cloudflare compresses on the edge, but this hop is still worth compressing:
    # it is the one carrying 20-40KB search payloads to the tunnel.
    gzip            on;
    gzip_types      text/plain text/css application/json application/javascript
                    text/xml application/xml image/svg+xml;
    gzip_min_length 1024;
    gzip_proxied    any;

    # Which colour is live. Rewritten by deploy/promote.sh, which then reloads.
    include /etc/nginx/upstreams/active.conf;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection        "";

    # A cold search on this box can genuinely take 20s when the index is not
    # resident. The default 60s read timeout is enough, but the CONNECT timeout
    # is deliberately short: if the active colour is not accepting connections
    # something is wrong with the deploy, and failing in 2s beats hanging.
    proxy_connect_timeout 2s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # Imports accept a URL, not an upload, so nothing here is large. Small cap
    # rather than nginx's 1MB default, since a body bigger than this is a
    # mistake or an attack.
    client_max_body_size 512k;

    # ── www -> apex ─────────────────────────────────────────────────────────
    #
    # www.ficatlas.com resolved through the same tunnel and served the whole
    # site on a 200. Two hostnames, one app, and — this is the part that bites —
    # two cookie jars: the session cookie is host-only (no Domain attribute, on
    # purpose), so a session created on ficatlas.com is simply not sent to
    # www.ficatlas.com.
    #
    # From the inside that is indistinguishable from having been signed out. You
    # arrive on www from a link or the address bar's autocomplete, the site says
    # "Sign in", and "Stay signed in" appears not to have worked. Sign in there
    # and you now have two unrelated sessions, so whether an owner-only page
    # works depends on which hostname you happened to land on.
    #
    # A regex server_name is matched ahead of the default server, so this takes
    # www without touching the block that serves everything else. It also
    # collapses the duplicate that was being served to crawlers — the canonical
    # tag already pointed at the apex, but a 301 is the part that actually
    # consolidates them.
    server {
        listen 8080;
        listen [::]:8080;
        server_name ~^www\.(?<apex_host>.+)$;
        # Always https: TLS is terminated at Cloudflare, so $scheme here is the
        # plaintext hop from the tunnel and would send the browser to http://.
        return 301 https://$apex_host$request_uri;
    }

    # ── scan.ficatlas.com: the accessibility scanner ────────────────────────
    #
    # A second product on the same tunnel. cloudflared shares this container's
    # network namespace, so a public hostname pointed at localhost:8080 lands
    # here and is separated from FicAtlas by server_name alone — no second
    # tunnel, no second certificate, no port open on the machine.
    #
    # proxy_pass goes through a VARIABLE, and that is the whole point of the
    # resolver line. Naming the container directly makes nginx resolve it at
    # STARTUP and refuse to start if it is missing — which would mean a stopped
    # side project takes ficatlas.com down with it. Through a variable the name
    # is resolved per request: the scanner being down costs the scanner a 502
    # and costs FicAtlas nothing.
    server {
        listen 8080;
        listen [::]:8080;
        server_name scan.ficatlas.com;

        # Docker's embedded DNS. ipv6=off because the compose network hands out
        # A records only, and nginx would otherwise wait on a AAAA that never
        # comes back.
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $accessscan_upstream "accessscan-web-1:3000";

        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        location / {
            proxy_pass http://$accessscan_upstream;
            # A scan launches a browser and loads someone else's site, which is
            # seconds rather than milliseconds. The default 60s read timeout is
            # enough for the scan itself but not for a slow target plus a cold
            # browser, and a timeout here reads to the user as a broken tool.
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }
    }

    # ── public ──────────────────────────────────────────────────────────────
    server {
        # Both families. `localhost` resolves to ::1 before 127.0.0.1 on this
        # image, so an IPv4-only listener answers 127.0.0.1 fine and refuses
        # localhost outright — which is exactly the address the Cloudflare
        # dashboard is given, and exactly the kind of failure that looks like a
        # broken tunnel rather than a missing listener.
        #
        # default_server, and it is load-bearing. `server_name _` is not a
        # wildcard — it is just a name that never matches — so this block only
        # ever served anything because it was the FIRST block on :8080 and nginx
        # falls back to the first one. Adding the www redirect above it silently
        # took that role: the apex stopped matching any server_name, fell
        # through to the redirect, and every request 301'd to https:/// with an
        # empty host. Saying which block is the default removes the dependence
        # on ordering entirely.
        listen 8080 default_server;
        listen [::]:8080 default_server;
        server_name _;

        # cloudflared health-checks and Cloudflare's own probes should not have
        # to wake the app. Answered here, cheaply, and never proxied.
        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        location / {
            proxy_pass http://web_active;
            # A dead upstream should fail over rather than 502, but only for
            # requests it is safe to retry: a POST that already reached the app
            # must not be replayed against the other colour.
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
        }
    }

    # ── internal: the API, reachable only on the compose network ────────────
    server {
        listen 8081;
        listen [::]:8081;
        server_name _;

        # No keep-alive on this hop, deliberately, and it is the fix for a bug
        # that had already been "fixed" once.
        #
        # Next proxies /api/* here through http-proxy, which pools connections on
        # a plain node:http Agent. nginx closed an idle one, Node reused it
        # anyway, and the request died with ECONNRESET — the visitor got a 500
        # while the API logged nothing at all, because the request never reached
        # it. The earlier mitigation was `keepalive_timeout 65 60`, which makes
        # nginx ADVERTISE `Keep-Alive: timeout=60` so a client can close first.
        # node:http's Agent does not read that header. undici does; http-proxy
        # does not use undici. So the advertisement went to the one client that
        # mattered and was ignored, and the race stayed exactly as it was.
        #
        # It surfaces as "the first click after a quiet spell fails, then works":
        # /admin at breakfast after the site idled overnight, which is how it was
        # found — an owner told the health page was broken while every other tab
        # on it worked.
        #
        # A handshake per request on the container network is tens of
        # microseconds, against a query this proxies that takes tens of
        # milliseconds at best. There is nothing to weigh here.
        keepalive_timeout 0;

        location / {
            proxy_pass http://api_active;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
        }
    }
}
