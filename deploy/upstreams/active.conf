# WHICH COLOUR IS LIVE. Generated — edit via deploy/promote.sh, not by hand.
#
# promote.sh rewrites this file and reloads nginx. It is bind-mounted so the
# rewrite happens on the host and needs no shell inside the container.
#
# `max_fails=0` on purpose: nginx's default is to eject an upstream after a
# failed request and refuse it for 10s. With exactly one server in the pool,
# ejecting it means every request 502s until the timer expires — a single slow
# cold search could take the whole site down for ten seconds. Health is decided
# by promote.sh before the switch, not by nginx afterwards.

upstream web_active {
    server web-blue:3000 max_fails=0;
    keepalive 32;
}

upstream api_active {
    server api-blue:8000 max_fails=0;
    keepalive 32;
}
