# See docker-compose.public.yml for the reasoning: Docker's json-file driver is
# unbounded by default, and an unbounded log on this disk eventually stops
# Postgres writing. The dev stack is quieter than the public one but runs the
# worker, which logs continuously.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    logging: *logging
    image: postgres:16-alpine
    # No service had a restart policy, which is why the whole stack sat dead for
    # four weeks after a reboot. Docker itself is enabled at boot, so this alone
    # makes FicAtlas come back on its own. "unless-stopped" (not "always") so an
    # explicit `docker compose stop` stays stopped.
    restart: unless-stopped
    environment:
      POSTGRES_USER: ficatlas
      # Single source of truth for the password, so changing it in .env cannot
      # leave the backend and worker still holding the old one. Defaults to the
      # development value, so this file behaves exactly as before without .env.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ficatlas}
      POSTGRES_DB: ficatlas
    # Postgres ships with defaults sized for a tiny machine (shared_buffers 128MB,
    # work_mem 4MB, random_page_cost 4.0). The stories table alone is ~3.7GB, so
    # those defaults meant almost nothing stayed cached between queries and the
    # planner was biased against index scans.
    #
    # random_page_cost is the important one: 4.0 encodes the seek cost of a
    # spinning disk. On the NVMe this runs on, random reads are nearly as cheap as
    # sequential, and the high default actively pushed the planner toward
    # sequential scans over the GIN indexes that make search fast.
    #
    # Sized to leave room for the other containers on this host — raise
    # shared_buffers toward 25% of RAM if FicAtlas gets a box to itself.
    # Sized for the index as it now stands (~18M works, table + indexes well over
    # 10GB). shared_buffers was 512MB when the host only had ~2GB free during the
    # bulk imports; with those done there is room to keep far more of the hot
    # index pages resident, which is where fandom/tag browsing spends its time.
    # shared_buffers 1GB -> 3GB, measured rather than guessed.
    #
    # `stories` is 16GB of heap and 21GB of indexes, and search lives almost
    # entirely in the trigram/FTS indexes: tags_trgm 3.2GB, doc_fts 2.7GB,
    # summary_trgm 1.6GB, characters_trgm 1.5GB. Against that, 1GB of shared
    # buffers gave a cache hit ratio of 51.4% — sampled as a delta across eight
    # live searches, so this is current behaviour and not an artifact of the bulk
    # import. Half of every search's block reads were going to disk, which is why
    # ten concurrent searches tripled latency while neither container exceeded
    # 28% of its CPU limit. The bottleneck was never CPU.
    #
    # 3GB, not more, because this box runs a desktop and a browser on 15GB and
    # has to stay usable. Measured headroom at the time of the change: 10.2GB
    # available. 3GB triples the resident hot set and still leaves ~7GB, which
    # survives the ~8GB transient a frontend build takes.
    #
    # effective_cache_size is a planner hint, not an allocation — it tells the
    # planner how much of the index it may assume is cached between shared
    # buffers and the OS page cache, and costs nothing to raise.
    # 1.5GB. This was raised to 3GB on measured evidence — cache hit ratio on
    # never-run queries went 51.4% -> 61.5% and ten concurrent searches went from
    # 2.94s to 1.01s wall — and then backed off, because the host could not pay
    # for it. At 3GB the machine reached 438MB available with swap 100% full and
    # a load average of 34, and the desktop stuttered.
    #
    # The reason a too-large shared_buffers is actively harmful here, rather than
    # merely unhelpful: shared_buffers is pinned shared memory. The OS page cache
    # is not — it is reclaimable under pressure. So on a box that is short of
    # RAM, memory given to shared_buffers is memory the desktop can never get
    # back, and worse, the buffers themselves can be swapped out, which turns
    # "cached page" into "page fault to disk" and inverts the entire point.
    #
    # 1.5GB keeps a modest gain over the original 1GB while leaving the page
    # cache room to do the rest of the work. If FicAtlas ever gets a box that
    # owns its RAM, 3GB+ is the right number and the measurements above say so.
    command: >
      postgres
      -c shared_buffers=1536MB
      -c effective_cache_size=4GB
      -c work_mem=32MB
      -c maintenance_work_mem=512MB
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c max_parallel_workers_per_gather=1
      -c jit=off
    # Loopback only. This was bound to 0.0.0.0, which put a Postgres with the
    # password "ficatlas" on every interface — reachable by anything on the LAN or
    # the tailnet. Nothing outside this host needs it: the backend connects over the
    # compose network, and `docker compose exec db psql` still works for admin.
    # Docker gives a container 64MB of /dev/shm by default. Postgres allocates
    # shared memory segments there for parallel query workers, and at 18M rows the
    # parallel plans need more than that — real searches (tags=Fluff, page=3,
    # sort=word_count_desc) were failing outright with
    #   DiskFull: could not resize shared memory segment ... No space left on device
    # which surfaces as a 500, not a slow query.
    # Memory limits on the DEVELOPMENT stack too, which had none.
    #
    # This is not a server that owns its RAM: it runs a desktop, a browser, and
    # other projects' containers alongside FicAtlas on 15GB. Measured while
    # stuttering — load average 11 with every container near-idle CPU, 4GB in
    # swap and 91% iowait. Nothing was busy; the machine was thrashing.
    #
    # Unlimited containers make that possible: a full-index aggregate or a bulk
    # import can take whatever it likes and push the desktop into swap, and the
    # symptom lands on whoever is using the machine rather than on FicAtlas.
    # shared_buffers also came down from 2GB, which was sized for a box that
    # owns its memory.
    # 5g to hold the 3GB of shared buffers plus work_mem and per-connection
    # overhead — this is the figure docker-compose.prod.yml already sanctions for
    # this service. cpus 1.0 -> 3.0 on a 12-core host: a cap, not a reservation,
    # so it costs the desktop nothing until the database is genuinely busy, and
    # it is what lets concurrent searches overlap instead of queueing.
    # 3g: 1.5GB of shared buffers plus work_mem and per-connection overhead, with
    # room to spare but not so much that the container can quietly grow into the
    # desktop's memory.
    #
    # Memory is the floor that stops the thrash and is fixed here. cpus is only a
    # STARTING value: autotune.sh runs from cron every two minutes and rewrites it
    # live with `docker update --cpus`, widening when the host is idle and
    # tightening under memory pressure. So this does not peg the database at three
    # cores — it sets where it begins, and where a restart returns it to.
    mem_limit: 3g
    cpus: 3.0
    shm_size: "1gb"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ficatlas -d ficatlas"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    logging: *logging
    build: ./backend
    # Named so the worker can reuse this exact image instead of compose building
    # a second identical 2.7GB copy under its own service name.
    image: ficatlas-backend
    restart: unless-stopped
    # Multiple worker processes, because one was the ceiling on every cheap
    # endpoint. FastAPI runs sync route handlers — and search is deliberately
    # sync — in a threadpool, but there is still one process, one GIL and
    # therefore roughly one core doing Python work on a 12-core box.
    #
    # --reload is mutually exclusive with --workers: it is a development
    # convenience that restarts the API on any file change, and it also kills
    # anything running inside the container. Set UVICORN_RELOAD=true to get it
    # back while working on the code; leave it off for an unattended box.
    #
    # WEB_CONCURRENCY is read by uvicorn for the worker count AND by
    # db/session.py and ratelimit.py, which divide the connection-pool budget
    # and the rate limits across workers. Those three have to agree, so it is
    # one variable rather than three.
    #
    # Four, not twelve: the workers are not the scarce resource. Search is bound
    # by disk reads against a 39GB database with ~2GB of cache, so more Python
    # processes buy nothing there — and this box is also a desktop.
    # See backend/start.sh: one WEB_CONCURRENCY knob drives the uvicorn worker
    # count, the connection-pool budget (db/session.py) and the rate-limit
    # divisor (ratelimit.py), which all have to agree. Set UVICORN_RELOAD=true
    # for single-process live reload while working on the code.
    command: ["sh", "/app/start.sh"]
    # Loopback only, matching the architecture in the README: clients reach the API
    # through the frontend's /api/* rewrite on port 3000, so 8000 never needs to be
    # externally reachable. http://localhost:8000/docs still works on this host.
    #
    # This comment used to say api/library.py had no auth on any endpoint. That
    # was true when it was written and is not any more — every destructive
    # endpoint requires admin, enforced server-side. Keeping the port on loopback
    # regardless: defence in depth, and nothing outside this host needs it.
    ports:
      - "127.0.0.1:8000:8000"
    # So `docker compose ps` tells the truth.
    #
    # Only the database had a healthcheck, which meant a wedged API — process
    # alive, answering nothing — still reported "Up", and that is exactly the
    # state you are trying to identify when something is wrong. watchdog.sh
    # already probes this endpoint every five minutes and restarts on failure,
    # so this adds no recovery; it adds visibility, which is the half that was
    # missing while diagnosing.
    #
    # /health is a static dict with no database work, so it cannot itself become
    # load. start_period is generous because init_db() runs its idempotent DDL at
    # every startup and can take a while under lock contention — without it a
    # slow-but-fine boot would report unhealthy.
    # urllib rather than curl: the image is python:3.12-slim and has no curl.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status == 200 else 1)\""]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 90s
    environment:
      # See backend/ratelimit.py — marks our own SSR traffic so it is not
      # counted as one very busy client. Same value in both services.
      INTERNAL_RENDER_TOKEN: ${INTERNAL_RENDER_TOKEN:-}
      # Worker count, pool budget divisor and rate-limit divisor — see the
      # command above.
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-4}
      UVICORN_RELOAD: ${UVICORN_RELOAD:-false}
      DATABASE_URL: postgresql://ficatlas:${POSTGRES_PASSWORD:-ficatlas}@db:5432/ficatlas
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    mem_limit: 1500m
    # 0.75 of a core was the hard ceiling on how many readers could be served at
    # once, regardless of how fast the database answered. Handlers are blocking
    # psycopg2 running in AnyIO's thread pool, so concurrency here is real work,
    # not just waiting. A cap, not a reservation — 2 of 12 cores.
    cpus: 2.0

  frontend:
    logging: *logging
    build: ./frontend
    restart: unless-stopped
    environment:
      # See backend/ratelimit.py — proves a request is our own server-side
      # rendering rather than a browser, so rendered pages are not all counted
      # against a single client bucket. Must match the backend's value.
      INTERNAL_RENDER_TOKEN: ${INTERNAL_RENDER_TOKEN:-}
    ports:
      # Development is reachable from the host and tailnet peers, never from
      # every LAN interface. An unset TAILSCALE_IP fails closed to an unused
      # loopback address rather than accidentally publishing on 0.0.0.0.
      - "127.0.0.1:3000:3000"
      - "${TAILSCALE_IP:-127.0.0.2}:3000:3000"
    depends_on:
      - backend
    mem_limit: 600m

  # ── Background worker ──────────────────────────────────────────────────────
  # Scheduled feed polls, crawls and long backfills used to run inside the API
  # process. Two problems with that: heavy work competed with request handling on
  # the same event loop, and anything started with `docker compose exec backend`
  # died whenever the API restarted — which killed the dedup and enrichment runs
  # twice during this work.
  #
  # The worker owns all recurring background work. Only it runs the scheduler
  # (RUN_SCHEDULER), so the API never double-polls, and its restarts are
  # independent of the API's.

  # FanFiction.net engagement, which nothing else on this box can reach.
  #
  # Its own service, and its own image, for one reason: FF.net answers 403 to
  # every HTTP client — httpx with a Chrome User-Agent included — and 200 to a
  # real browser engine. So this needs Chromium, and adding Chromium to the
  # backend image would put ~400MB back into the 533MB it was just reduced to,
  # for one job. The Playwright image already carries it.
  #
  # Shares the database, so what it collects is live on the public site with no
  # deploy. See ffnet-harvester/harvest.js for the per-session 403 behaviour and
  # why each page load gets a fresh browser context.
  ffnet-harvester:
    logging: *logging
    image: mcr.microsoft.com/playwright:v1.49.0-jammy
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./ffnet-harvester:/app
    # npm install on start rather than a Dockerfile: two dependencies, and this
    # way the image stays the stock upstream one with nothing to rebuild.
    command: sh -c "npm install --no-audit --no-fund --silent && node harvest.js"
    environment:
      DATABASE_URL: postgresql://ficatlas:${POSTGRES_PASSWORD:-ficatlas}@db:5432/ficatlas
      # Seconds between page loads. 25 works per page means even this modest
      # rate clears the 6.5M backlog in weeks; it is set by what is decent
      # toward a live site, not by what can be got away with.
      FFNET_DELAY_MS: ${FFNET_DELAY_MS:-6000}
      FFNET_PAGES_PER_VISIT: ${FFNET_PAGES_PER_VISIT:-10}
      # Sort by favourites, so the walk starts with the works whose engagement
      # figures most affect a ranking — and which the 2017-era dump actually
      # contains. Sorting by "recently updated" walks works we do not hold.
      FFNET_SORT: ${FFNET_SORT:-4}
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 1g
    cpus: 1.0

  worker:
    logging: *logging
    image: ficatlas-backend    # same image as the API; built by the backend service
    restart: unless-stopped
    command: python worker.py
    environment:
      DATABASE_URL: postgresql://ficatlas:${POSTGRES_PASSWORD:-ficatlas}@db:5432/ficatlas
      # Its own connection budget, smaller than the API's. Both pools are sized
      # against one max_connections=100: the API takes 48 (4 workers x 12), this
      # takes 18, and the rest is left for psql, maintenance scripts and the
      # superuser reserve. Background jobs are sequential and do not need many.
      DB_POOL_SIZE: ${WORKER_DB_POOL_SIZE:-12}
      DB_MAX_OVERFLOW: ${WORKER_DB_MAX_OVERFLOW:-6}
      RUN_SCHEDULER: "true"
      # The bulk AO3 dump stops at work id 63,178,258 (~mid-2024) while AO3 is
      # now issuing ~89.7M, so everything recent can only come from crawling.
      RECENT_WORKS: "true"
      # 6.6M FF.net works have no genres, characters, ships or engagement counts
      # at all — that dump carries none. This recovers them from archive.org's
      # copies, a few hundred stories at a time, longest first.
      ENRICH_FFNET: "true"
      # New imports and live fetches keep introducing cross-posted duplicates.
      DEDUP_CROSSPOSTS: "true"
      # Works were frozen at import time. Tracked fandoms refresh for free via
      # the recent-works loop; this re-checks hosted works-in-progress, which are
      # the ones actually being read.
      REFRESH_STALE: "true"
      # The AO3 dump ships titles cut off mid-phrase ("Harry Potter and"), which
      # only the work page can resolve.
      TITLE_REPAIR: "true"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    mem_limit: 1500m
    cpus: 1.0

volumes:
  pgdata:
